[tool.poetry]
name = "can-cluster"
version = "0.1.0"
description = "Gauge Cluster to communicate with FuelTech via CAN"
authors = ["Lucas Torresan"]
readme = "readme.md"
package-mode = false

[tool.poetry.dependencies]
# <3.14: Kivy 2.3.1 ships wheels only up to cp313 (3.14 would mean a source
# build on the Mac). PySide6 6.11 is fine on 3.13 too. The Pi runs 3.11.
python = ">=3.10,<3.14"
kivy = ">=2.3.1,<3.0.0"
python-can = ">=4.6.1,<5.0.0"
pyserial = ">=3.5,<4.0"
black = ">=25.1.0,<26.0.0"
rpi-lgpio = { version = "^0.6", markers = "sys_platform == 'linux'" }
# QML build (cluster_qml.py). Split by platform:
#  - Pi (linux): 6.7.3 is the last release whose aarch64 wheel installs on
#    bookworm's glibc 2.36. Needs python <3.13 (the Pi runs 3.11).
#  - Mac (darwin): 6.11.x, verified with the custom scene-graph items on
#    Python 3.14. (6.10.x crashed in Python render overrides — avoid.)
pyside6-essentials = [
    { version = "6.7.3", markers = "sys_platform == 'linux'", python = ">=3.10,<3.13" },
    { version = ">=6.11.1,<6.12", markers = "sys_platform == 'darwin'", python = ">=3.10,<3.15" },
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
